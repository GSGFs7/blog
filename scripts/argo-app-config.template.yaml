apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.gsgfs.sh/GSGFs/blog.git
    targetRevision: main
    path: .config/k8s/overlays/prod
    kustomize:
      patches:
        - target:
            kind: Ingress
            name: blog-ingress
          patch: |-
            - op: replace
              path: /spec/rules/0/host
              value: ${DOMAIN}
            - op: replace
              path: /spec/tls/0/hosts/0
              value: ${DOMAIN}
        - target:
            kind: Ingress
            name: blog-static-ingress
          patch: |-
            - op: replace
              path: /spec/rules/0/host
              value: ${DOMAIN}
            - op: replace
              path: /spec/tls/0/hosts/0
              value: ${DOMAIN}
        - target:
            kind: Ingress
            name: blog-litellm-ingress
          patch: |-
            - op: replace
              path: /spec/rules/0/host
              value: ${DOMAIN}
            - op: replace
              path: /spec/tls/0/hosts/0
              value: ${DOMAIN}
        - target:
            kind: Ingress
            name: blog-prometheus-ingress
          patch: |-
            - op: replace
              path: /spec/rules/0/host
              value: ${DOMAIN}
            - op: add
              path: /spec/tls
              value:
                - hosts:
                    - ${DOMAIN}
                  secretName: blog-django-tls-secret
        - target:
            kind: IngressRoute
            name: blog-scanner-block
          patch: |-
            - op: replace
              path: /spec/routes/0/match
              value: Host(`${DOMAIN}`) && PathRegexp(`(?i)^/(?:\.(?:env|git|svn|hg|aws|ssh)(?:$|[./])|\.DS_Store$|\.npmrc$|\.ht(?:access|passwd)$|wp-(?:admin|login|content|includes)(?:/|\.php|$)|xmlrpc\.php$|phpmyadmin(?:/|$)|pma(?:/|$)|adminer(?:\.php)?$|vendor/phpunit(?:/|$)|server-(?:status|info)$|actuator(?:/|$)|cgi-bin(?:/|$)|boaform(?:/|$)|HNAP1$|composer\.(?:json|lock)$|package(?:-lock)?\.json$|pnpm-lock\.yaml$|yarn\.lock$|static/(?:\.|.*\.map$|staticfiles\.json$|dist/manifest(?:\.[0-9a-f]+)?\.json$|ssr/(?:ssr(?:\.[0-9a-f]+)?\.mjs|solid-islands(?:\.[0-9a-f]+)?\.json)$))`)
  destination:
    server: https://kubernetes.default.svc # current cluster
    namespace: blog
  syncPolicy:
    automated:
      prune: true # Automatically delete resources that no longer exist in Git
      selfHeal: true # Automatically correct back to Git status
