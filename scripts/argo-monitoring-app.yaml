apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blog-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.gsgfs.sh/GSGFs/blog.git
    targetRevision: main
    path: .config/k8s/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: blog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
