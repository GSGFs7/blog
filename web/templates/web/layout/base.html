{% load static vite solid_islands %}

<!DOCTYPE html>
<html lang="zh-Hans" class="no-js dark site-root" style="text-autospace: normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <script type="module" src="{% vite_asset 'web/typescript/core/theme.ts' %}"></script>
  <script type="application/javascript" src="{% static 'js/load.js' %}"></script>
  <script type="module" src="{% vite_asset 'web/typescript/index.tsx' %}"></script>
  <link rel="stylesheet" href="{% vite_asset 'web/typescript/styles/navbar.css' %}" crossorigin>
  <link rel="stylesheet" href="{% vite_asset 'web/typescript/styles/footer.css' %}" crossorigin>
  <link rel="stylesheet" href="{% vite_asset 'web/typescript/styles/base.css' %}" crossorigin>
  <link rel="stylesheet" href="{% vite_asset 'web/typescript/styles/globals.css' %}" crossorigin>
  <link rel="stylesheet" href="{% vite_asset 'web/typescript/styles/font.css' %}" crossorigin>
  <link rel="alternate" type="application/atom+xml" title="GSGFs's blog" href="{% url 'blog_feed' %}">
  <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
  <title>{% block title %}{% endblock %} - {{ SITE_TITLE }}</title>
  {% vite_hmr %}
  {% block extra_head %}{% endblock %}
</head>
<body class="site-body" hx-boost="true" hx-ext="head-support, preload">
<header class="site-header">
  {% include "web/partials/globals/navbar.html" %}
</header>

<div class="site-shell">
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  {% include "web/partials/globals/footer.html" %}
</div>
</body>
</html>
