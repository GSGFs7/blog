{% load solid_islands %}

<section
  aria-labelledby="wip-title"
  class="flex min-h-[60vh] flex-col items-center justify-center px-4 py-16 {{ class_name|default:'' }}"
>
  <div class="mb-8" aria-hidden="true">
    {% solid_island "WIP" %}
  </div>

  <a
    class="group inline-flex items-center gap-2 rounded-lg px-6 py-3 text-white transition-all duration-300 hover:text-gray-300"
    href="{{ back_url|default:'/' }}"
  >
    <svg
      class="h-4 w-4 transition-transform group-hover:-translate-x-1"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M10 19l-7-7m0 0l7-7m-7 7h18"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      ></path>
    </svg>
    <span>返回首页</span>
  </a>
</section>
