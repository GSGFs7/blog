{% extends "web/layout/base.html" %}

{% block title %}Home{% endblock %}

{% block extra_head %}
  <link
    rel="preload"
    as="image"
    href="https://img.gsgfs.moe/images/avif/6a/d5/6ad5852d8f1048c49a862e400a133d10da1fdb302bf3116fd74b0289b002731e.avif"
    type="image/avif"
    fetchpriority="high"
  >
  <link
    rel="prefetch"
    href="https://img.gsgfs.moe/images/avif/54/0f/540f78d0502e4afa4468660e0464d4e79dfdf685f9897eca6109214484a1ef12.avif"
    type="image/avif"
  >
  <link
    rel="prefetch"
    href="https://img.gsgfs.moe/images/avif/e7/6d/e76ddbc44702d3a34233660c77ce375122778121efcee9fd4cc7f7c669580949.avif"
    type="image/avif"
    media="(min-width: 640px)"
  >
{% endblock %}

{% block seo_head %}
  <link rel="canonical" href="{{ SITE_CANONICAL }}/">
  <meta name="description" content="{{ SITE_DESCRIPTION }}">
  <meta property="og:site_name" content="{{ SITE_TITLE }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ SITE_TITLE }}">
  <meta property="og:description" content="{{ SITE_DESCRIPTION }}">
  <meta property="og:url" content="{{ SITE_CANONICAL }}/">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ SITE_TITLE }}">
  <meta name="twitter:description" content="{{ SITE_DESCRIPTION }}">
{% endblock %}

{% block content %}
  {% include "web/partials/festival/mid-autumn.html" %}
{% endblock %}
