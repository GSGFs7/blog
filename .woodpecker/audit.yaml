labels:
  scaner: "true"

when:
  - event: [push, pull_request, manual]
    branch: [main, woodpecker-test, dev]
  - event: cron
    cron: dependency-audit
    branch: main

steps:
  - name: python-audit
    image: docker.io/library/archlinux:latest
    depends_on: []
    commands:
      - pacman -Syu uv git python --noconfirm
      - uv audit --locked

  - name: javascript-audit
    image: docker.io/library/archlinux:latest
    depends_on: []
    commands:
      - pacman -Syu nodejs pnpm --noconfirm
      - pnpm audit

  - name: rust-audit
    image: docker.io/library/archlinux:latest
    depends_on: []
    commands:
      - pacman -Syu base-devel git rustup --noconfirm
      - rustup toolchain install stable --profile minimal
      - cargo +stable install cargo-audit --locked
      - cargo +stable audit --file native/markdown/Cargo.lock
