depends_on:
  - build

when:
  - event: [push, manual]
    branch: main

concurrency: 1

steps:
  - name: update-kustomize
    image: docker.io/library/archlinux:latest
    environment:
      GITOPS_SSH_KEY:
        from_secret: GITOPS_SSH_KEY
      FORGEJO_KNOWN_HOSTS:
        from_secret: FORGEJO_KNOWN_HOSTS
      REGISTRY_DOMAIN:
        from_secret: REGISTRY_DOMAIN
      GITOPS_REPO_URL: ssh://git@forgejo-ssh.forgejo.svc.cluster.local/GSGFs/blog.git
      GITOPS_BRANCH: gitops
    commands:
      # install dependencies
      - pacman -Syu kustomize git openssh --noconfirm
      # config ssh
      - install -d -m 700 ~/.ssh
      - printf '%s\n' "$GITOPS_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - printf '%s\n' "$FORGEJO_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - chmod 644 ~/.ssh/known_hosts
      # config git
      - git config user.email "woodpecker-bot@git.gsgfs.sh"
      - git config user.name "Woodpecker CI"
      - git remote remove gitops 2>/dev/null || true
      - git remote add gitops "$GITOPS_REPO_URL"
      # merge main & update kustomization & push
      - |
        set -eu
        git cat-file -e "${CI_COMMIT_SHA}^{commit}"
        git fetch --no-tags gitops refs/heads/main
        if [ "$(git rev-parse FETCH_HEAD)" != "$CI_COMMIT_SHA" ]; then
          echo "Skipping superseded build: $CI_COMMIT_SHA"
          exit 0
        fi
        git fetch --no-tags gitops "refs/heads/$GITOPS_BRANCH"
        git checkout --detach FETCH_HEAD
        git merge --no-ff --no-commit -X theirs "$CI_COMMIT_SHA"
        cd .config/k8s/overlays/prod
        kustomize edit set image "blog-app=$REGISTRY_DOMAIN/blog-app:${CI_COMMIT_SHA}"
        kustomize edit set image "blog-backup=$REGISTRY_DOMAIN/blog-backup:${CI_COMMIT_SHA}"
        kustomize edit set image "blog-model-downloader=$REGISTRY_DOMAIN/blog-model-downloader:${CI_COMMIT_SHA}"
        kustomize edit set image "blog-pgbouncer=$REGISTRY_DOMAIN/blog-pgbouncer:${CI_COMMIT_SHA}"
        git add kustomization.yaml
        if ! git diff --cached --quiet || git rev-parse --verify -q MERGE_HEAD >/dev/null; then
          git commit -m "chore(gitops): sync main and update image tags to ${CI_COMMIT_SHA:0:7} [skip ci]"
          git push gitops "HEAD:refs/heads/$GITOPS_BRANCH"
        else
          echo "No changes to commit"
        fi
