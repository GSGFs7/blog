[project]
name = "GSGFs-blog"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "blake3>=1.0.8",
    "boto3>=1.40.63",
    "celery>=5.6.3",
    "crc64nvme-native",
    "cryptography>=49.0.0",
    "django>=6.0.6",
    "django-celery-beat>=2.8.1",
    "django-ninja>=1.6.2",
    "django-prometheus>=2.4.0",
    "django-redis>=7.0.0",
    "django-storages[s3]>=1.14.6",
    "django-otp>=1.7.0",
    "gunicorn>=23.0.0",
    "httpx2>=2.7.0", # well maintained httpx
    # Using fork because original fxsjy/jieba is no longer maintained; this fork includes Python 3.13+ compatibility fixes
    "jieba @ git+https://github.com/GSGFs7/jieba.git@master",
    "markdown-it-rs-py",
    "nh3>=0.3.6",
    "orjson>=3.11.9",
    "pgvector>=0.4.1",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.3.3",
    "pypinyin>=0.55.0",
    "qrcode>=8.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "resend>=2.19.0",
    "uvicorn[standard]>=0.42.0",
]


[project.optional-dependencies]
ml = ["filelock>=3.25.2", "huggingface-hub>=1.20.1", "sentence-transformers>=5.1.2", "torch>=2.9.0"]


[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "django-debug-toolbar>=6.1.0",
    "boto3-stubs[s3]>=1.40.63",
    "celery-types>=0.23.0",
    "flower>=2.0.1",
    "ruff>=0.16.1",
]
# for 'scripts/download-gguf-model.py'
model-download = ["filelock>=3.25.2", "huggingface-hub>=1.20.1"]
# for 'scripts/audit_cdn_cache.py'
cdn-audit = ["playwright>=1.62.0"]


[tool.uv.sources]
crc64nvme-native = { path = "native/crc64nvme" }
markdown-it-rs-py = { path = "native/markdown" }
torch = { index = "pytorch" }


[[tool.uv.index]]
name = 'pypi'
url = "https://pypi.org/simple"


[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["I", "E", "F"]
exclude = ["**/migrations/*.py"]

[tool.ruff.format]
exclude = ["**/migrations/*.py", "native/markdown/upstream/*"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "blog/asgi.py", "blog/wsgi.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
