[package]
name = "markdown-it-rs-py"
version = "0.1.0"
edition = "2024"

[lib]
name = "markdown_it_rs_py"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
ammonia = "=4.1.2"
html-escape = "=0.2.13"
lol_html = "=3.0.1"
markdown-it-rs = { path = "upstream", default-features = false, features = [
    "linkify",
    "syntect",
    "katex",
] }
pyo3 = "0.29"
regex = "1"
serde_json = "1"
url = "2"

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
serde = { version = "1", features = ["derive"] }
