apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog

resources:
- ../../base
- ingress.yaml
- cluster-issuer.yaml
- middleware-whitelist.yaml
- middleware-scanner-block.yaml

patches:
- target:
    kind: ConfigMap
    name: blog-config
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: blog-config
    data:
      STATIC_URL: "https://static.gsgfs.moe/static/"

# In prod, images are managed by Woodpecker CI & Argo CD
images:
- name: blog-app
  newName: registry.gsgfs.sh/blog-app
  newTag: 83b912c53e80722eb08acefb6c354c7de41c696a
- name: blog-backup
  newName: registry.gsgfs.sh/blog-backup
  newTag: 83b912c53e80722eb08acefb6c354c7de41c696a
- name: blog-model-downloader
  newName: registry.gsgfs.sh/blog-model-downloader
  newTag: 83b912c53e80722eb08acefb6c354c7de41c696a
- name: blog-pgbouncer
  newName: registry.gsgfs.sh/blog-pgbouncer
  newTag: 83b912c53e80722eb08acefb6c354c7de41c696a
