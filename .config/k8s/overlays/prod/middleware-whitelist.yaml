apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: prometheus-whitelist
  namespace: blog
spec:
  ipAllowList:
    # Public requests arrive through the Kubernetes load balancer, so Traefik sees
    # an internal hop as RemoteAddr. Check X-Forwarded-For instead, otherwise the
    # private CIDR whitelist below also allows public clients through the LB.
    ipStrategy:
      depth: 1
    sourceRange:
      - 127.0.0.1/32
      - 10.0.0.0/8
      - 192.168.0.0/16
      - 172.16.0.0/12
