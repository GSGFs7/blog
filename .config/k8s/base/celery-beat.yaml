# k8s/base/celery-beat.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-celery-beat
  labels:
    app: blog-celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-celery-beat
  template:
    metadata:
      labels:
        app: blog-celery-beat
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: blog-app:latest
          command:
            - python
            - -c
            - |
              import socket, time
              addr = ('blog-pgbouncer', 6432)
              while True:
                  try:
                      socket.create_connection(addr, timeout=2)
                      break
                  except Exception:
                      print('waiting for pgbouncer...')
                      time.sleep(2)
        - name: wait-for-redis
          image: blog-app:latest
          command:
            - python
            - -c
            - |
              import socket, time
              addr = ('blog-redis', 6379)
              while True:
                  try:
                      socket.create_connection(addr, timeout=2)
                      break
                  except Exception:
                      print('waiting for redis...')
                      time.sleep(2)
      containers:
        - name: blog-celery-beat
          image: blog-app:latest
          command:
            - celery
            - -A
            - blog
            - beat
            - --pidfile=/tmp/celerybeat.pid
            - --loglevel=info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - configMapRef:
                name: blog-config
            - secretRef:
                name: blog-secrets
          env:
            - name: DATABASE_HOST
              value: blog-pgbouncer
            - name: DATABASE_PORT
              value: "6432"
            - name: DATABASE_USE_PGBOUNCER
              value: "True"
            - name: DATABASE_CONN_MAX_AGE
              value: "0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "150m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) || exit 1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) || exit 1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
