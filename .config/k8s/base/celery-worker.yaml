# k8s/base/celery-worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-celery-worker
  labels:
    app: blog-celery-worker
spec:
  selector:
    matchLabels:
      app: blog-celery-worker
  template:
    metadata:
      labels:
        app: blog-celery-worker
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: blog-app:latest
          command:
            - python
            - -c
            - |
              import socket, time
              addr = ('blog-postgres', 5432)
              while True:
                  try:
                      socket.create_connection(addr, timeout=2)
                      break
                  except Exception:
                      print('waiting for db...')
                      time.sleep(2)
        - name: wait-for-redis
          image: blog-app:latest
          command:
            - python
            - -c
            - |
              import socket, time
              addr = ('blog-redis', 6379)
              while True:
                  try:
                      socket.create_connection(addr, timeout=2)
                      break
                  except Exception:
                      print('waiting for redis...')
                      time.sleep(2)
      containers:
        - name: blog-celery-worker
          image: blog-app:latest
          command:
            - celery
            - -A
            - blog
            - worker
            - --loglevel=info
            - --concurrency=1
          envFrom:
            - configMapRef:
                name: blog-config
            - secretRef:
                name: blog-secrets
          resources:
            requests:
              memory: "1800Mi"
              cpu: "300m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A blog inspect ping -d "celery@$HOSTNAME" --timeout 15 || exit 1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A blog inspect ping -d "celery@$HOSTNAME" --timeout 15 || exit 1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: blog-model-pvc

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blog-celery-worker-hpa
spec:
  minReplicas: 1
  maxReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blog-celery-worker
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 85
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 95
