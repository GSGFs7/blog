# k8s/base/pgbouncer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-pgbouncer
  labels:
    app: blog-pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-pgbouncer
  template:
    metadata:
      labels:
        app: blog-pgbouncer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: blog-pgbouncer
          image: blog-pgbouncer:latest
          ports:
            - name: pgbouncer
              containerPort: 6432
          envFrom:
            - configMapRef:
                name: blog-config
            - secretRef:
                name: blog-secrets
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - PGPASSWORD="$DATABASE_PASSWORD" pg_isready -h 127.0.0.1 -p 6432 -U "$DATABASE_USER" -d "$DATABASE_NAME"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - PGPASSWORD="$DATABASE_PASSWORD" pg_isready -h 127.0.0.1 -p 6432 -U "$DATABASE_USER" -d "$DATABASE_NAME"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: blog-pgbouncer
spec:
  selector:
    app: blog-pgbouncer
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: pgbouncer
  type: ClusterIP
