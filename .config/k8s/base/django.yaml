# k8s/base/django.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-django
  labels:
    app: blog-django
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: blog-django
  template:
    metadata:
      labels:
        app: blog-django
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: staticfiles
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: blog-nginx-staticfiles-config
      initContainers:
        - name: copy-staticfiles
          image: blog-app:latest
          command: ["sh", "-c"]
          args: ["cp -R /app/staticfiles/. /staticfiles/"]
          volumeMounts:
            - name: staticfiles
              mountPath: /staticfiles
        - name: wait-for-db
          image: blog-app:latest
          command:
            - python
            - -c
            - |
              import socket, time
              addr = ('blog-pgbouncer', 6432)
              while True:
                  try:
                      socket.create_connection(addr, timeout=2)
                      break
                  except Exception:
                      print('waiting for pgbouncer...')
                      time.sleep(2)
      containers:
        - name: blog-django
          image: blog-app:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: blog-config
            - secretRef:
                name: blog-secrets
          env:
            - name: DATABASE_HOST
              value: blog-pgbouncer
            - name: DATABASE_PORT
              value: "6432"
            - name: DATABASE_USE_PGBOUNCER
              value: "True"
            - name: DATABASE_CONN_MAX_AGE
              value: "0"
          command:
            - gunicorn
            - -c
            - .config/gunicorn/gunicorn.conf.py
            - blog.asgi:application
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              port: 8000
              path: /api/health/
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              port: 8000
              path: /api/health/
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
        - name: staticfiles-service
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - name: static
              containerPort: 8080
          volumeMounts:
            - name: staticfiles
              mountPath: /usr/share/nginx/html/static
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: blog-django
spec:
  selector:
    app: blog-django
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: static
      port: 8080
      targetPort: static
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blog-django-hpa
spec:
  minReplicas: 2
  maxReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blog-django
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blog-nginx-staticfiles-config
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        gzip on;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            application/x-javascript
            text/xml
            application/xml
            application/xml+rss
            text/javascript
            image/svg+xml;
        gzip_vary on;

        location /static/ {
            alias /usr/share/nginx/html/static/;

            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";

            add_header Access-Control-Allow-Origin "*";
        }

        location = /favicon.ico {
            alias /usr/share/nginx/html/static/favicon.ico;

            expires 1d;
            add_header Cache-Control "public, max-age=86400";

            add_header Access-Control-Allow-Origin "*";
        }

        location = /robots.txt {
            alias /usr/share/nginx/html/static/robots.txt;

            expires 1h;
            add_header Cache-Control "public, max-age=3600";

            add_header Access-Control-Allow-Origin "*";
        }

        location = /llms.txt {
            alias /usr/share/nginx/html/static/llms.txt;
            default_type text/plain;

            expires 1h;
            add_header Cache-Control "public, max-age=3600";

            add_header Access-Control-Allow-Origin "*";
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
