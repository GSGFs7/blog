apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blog-django
  namespace: blog
spec:
  namespaceSelector:
    matchNames:
      - blog
  selector:
    matchLabels:
      app: blog-django
  endpoints:
    - port: http
      path: /prometheus/metrics
      interval: 30s
      scrapeTimeout: 10s
