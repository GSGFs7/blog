global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "blog-django"
    metrics_path: "/prometheus/metrics"
    static_configs:
      - targets: ["blog-django:8000"]
        labels:
          namespace: "blog"
          service: "blog-django"
          pod: "local-dev"

  - job_name: "blog-flower"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["blog-flower:5555"]
