# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# this file used in local dev only
# use `podman-compose up -d "blog-redis" "blog-postgres" "blog-pgbouncer"` start dependent services quickly

x-blog-app: &blog-app
  image: blog-dev:latest
  working_dir: /app
  volumes:
    - .:/app
    - django_venv:/opt/venv
    - uv_cache:/root/.cache/uv
  env_file:
    - .env
  environment: &blog-env
    DEBUG: ${DEBUG}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    DJANGO_LOGLEVEL: ${DJANGO_LOGLEVEL}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost},blog-django
    DATABASE_ENGINE: ${DATABASE_ENGINE}
    DATABASE_NAME: ${DATABASE_NAME}
    DATABASE_USER: ${DATABASE_USER}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    DATABASE_HOST: blog-pgbouncer
    DATABASE_PORT: 6432
    DATABASE_CONN_MAX_AGE: 0
    DATABASE_USE_PGBOUNCER: "True"
  networks:
    - blog-network

services:
  blog-django:
    <<: *blog-app
    container_name: blog-django
    build:
      context: .
      dockerfile: .config/docker/dev.Dockerfile
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - uv sync --frozen --no-install-project && exec uvicorn blog.asgi:application --host 0.0.0.0 --port 8000 --reload
    depends_on:
      blog-pgbouncer:
        condition: service_healthy
      blog-redis:
        condition: service_started

  blog-celery:
    <<: *blog-app
    container_name: blog-celery
    command:
      - sh
      - -c
      - until [ -x /opt/venv/bin/celery ]; do sleep 1; done && exec celery -A blog worker -Q celery,images --loglevel=info
    depends_on:
      blog-django:
        condition: service_started
      blog-redis:
        condition: service_started
      blog-pgbouncer:
        condition: service_healthy

  blog-celery-beat:
    <<: *blog-app
    container_name: blog-celery-beat
    command:
      - sh
      - -c
      - until [ -x /opt/venv/bin/celery ]; do sleep 1; done && exec celery -A blog beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      blog-django:
        condition: service_started
      blog-redis:
        condition: service_started
      blog-pgbouncer:
        condition: service_healthy

  blog-flower:
    <<: *blog-app
    profiles: ["tools"]
    container_name: blog-flower
    ports:
      - "5555:5555"
    command:
      - sh
      - -c
      - until [ -x /opt/venv/bin/celery ]; do sleep 1; done && exec celery -A blog flower --address=0.0.0.0 --port=5555
    depends_on:
      blog-django:
        condition: service_started
      blog-redis:
        condition: service_started

  blog-vite:
    image: blog-dev:latest
    container_name: blog-vite
    working_dir: /app
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/app
    command: ["pnpm", "exec", "vite", "--host", "0.0.0.0"]
    networks:
      - blog-network

  blog-pgbouncer:
    container_name: blog-pgbouncer
    build:
      context: .
      dockerfile: .config/k8s/containers/pgbouncer.Dockerfile
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PGBOUNCER_BACKEND_HOST: blog-postgres
      PGBOUNCER_BACKEND_PORT: 5432
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      PGBOUNCER_MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-40}
      PGBOUNCER_QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-30}
    depends_on:
      blog-postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    networks:
      - blog-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$${DATABASE_PASSWORD} pg_isready -h 127.0.0.1 -p 6432 -U $${DATABASE_USER} -d $${DATABASE_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s

  blog-postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: blog-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/
    ports:
      - "5432:5432"
    networks:
      - blog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 10s

  blog-redis:
    image: docker.io/library/redis:8-alpine
    container_name: blog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_date:/data
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  blog-llama-cpp:
    profiles: ["ai"]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: blog-llama-cpp
    volumes:
      - ./sentence_transformers_models:/models
    command:
      [
        "-m",
        "/models/ggml-org--embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--embedding",
      ]
    networks:
      - blog-network
    restart: always

  blog-litellm:
    profiles: ["ai"]
    image: docker.litellm.ai/berriai/litellm:v1.105.1
    container_name: blog-litellm
    environment:
      LITELLM_MASTER_KEY: ${REMOTE_EMBEDDING_API_KEY:-sk-1234}
      LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: "true"
    volumes:
      - ./.config/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--debug"]
    ports:
      - "4000:4000"
    depends_on:
      - blog-llama-cpp
    networks:
      - blog-network
    restart: always

  blog-prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: blog-prometheus
    volumes:
      - ./.config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks:
      - blog-network

  blog-grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: blog-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=123456
    volumes:
      - ./.config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.config/k8s/monitoring/blog-django.json:/var/lib/grafana/dashboards/blog-django.json:ro
    depends_on:
      - blog-prometheus
    ports:
      - "3030:3000"
    networks:
      - blog-network

volumes:
  postgres_data:
  redis_date:
  django_venv:
  uv_cache:

networks:
  blog-network:
    driver: bridge
